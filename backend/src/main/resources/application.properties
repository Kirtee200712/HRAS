# Database Configuration
# Using H2 by default so that the application runs perfectly out of the box when the user launches it.
# To switch to PostgreSQL, comment out the H2 lines and uncomment the PostgreSQL lines below.

# --- H2 Database (Default for demo) ---
spring.datasource.url=jdbc:h2:mem:roomnext;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# --- PostgreSQL (Production) ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/roomnext
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080
