# Database Configuration (PostgreSQL Production with Local Fallbacks)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/roomnext}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true

# JPA Hibernate Configuration
# Prefer validate when using Flyway in production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Server Configuration
# Render automatically injects the PORT environment variable
server.port=${PORT:8080}

# JWT Security
roomnext.app.jwtSecret=${JWT_SECRET:DefaultSecretKeyWhichIsVeryLongAndSecureForHS256AlgorithmRoomNext123!}
roomnext.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
roomnext.cors.frontend.url=${FRONTEND_URL:http://localhost:5173}
